<!doctype html>
<meta charset="utf-8">
<title>KetPlus WebRTC interop spike</title>
<!--
  Chromium's libwebrtc, the stack the iOS client uses, against `ketplus_webrtc_spike serve`.
  Serve this directory from 127.0.0.1 so WebCrypto is available. Query parameters:
    relay=udp|tcp  gather only relayed candidates from the TURN server, reaching it over that transport
    turn=<url>     the TURN server (default turn:127.0.0.1:3479, user and password "spike")
    mib=<n>        bulk size in each direction (default 32)
    ws=<url>       the spike's signaling socket (default ws://127.0.0.1:8765)
  The result appears in #result and goes to the host, which prints it and exits.
-->
<pre id="status">starting</pre>
<pre id="result"></pre>
<script type="module">
const params = new URLSearchParams(location.search)
const mebibyte = 1024 * 1024
const bulkBytes = Number(params.get('mib') ?? 32) * mebibyte
const chunkBytes = 64 * 1024
const highWater = mebibyte
const idlePings = 300
const relay = params.get('relay')
const turn = params.get('turn') ?? 'turn:127.0.0.1:3479'

const status = (text) => {
  document.getElementById('status').textContent = text
}
const pattern = (bytes) => {
  const data = new Uint8Array(bytes)
  for (let i = 0; i < bytes; i += 1) data[i] = (i * 31 + 7) & 0xff
  return data
}
const sha256 = async (data) =>
  [...new Uint8Array(await crypto.subtle.digest('SHA-256', data))].map((b) => b.toString(16).padStart(2, '0')).join('')
const roundTrips = (values, sent) => {
  const sorted = [...values].sort((a, b) => a - b)
  const at = (fraction) =>
    sorted.length ? +sorted[Math.min(sorted.length - 1, Math.round(fraction * (sorted.length - 1)))].toFixed(3) : -1
  return { sent, answered: sorted.length, p50Ms: at(0.5), p95Ms: at(0.95), p99Ms: at(0.99), maxMs: at(1) }
}
const within = (promise, ms, what) =>
  Promise.race([promise, new Promise((_, reject) => setTimeout(() => reject(new Error(`${what} timed out`)), ms))])

const run = async () => {
  const started = performance.now()
  const pc = new RTCPeerConnection(
    relay
      ? {
          iceServers: [{ urls: `${turn}?transport=${relay}`, username: 'spike', credential: 'spike' }],
          iceTransportPolicy: 'relay',
        }
      : {},
  )
  const control = pc.createDataChannel('control')
  const bulk = pc.createDataChannel('bulk')
  bulk.binaryType = 'arraybuffer'
  const opened = Promise.all(
    [control, bulk].map((channel) => new Promise((resolve) => channel.addEventListener('open', resolve, { once: true }))),
  )

  // Control answers: echoed pings by number, and the host's word on each bulk transfer.
  const pingSent = new Map()
  const pingTrip = new Map()
  let pingWaiter = null
  const replies = { received: null, sent: null }
  const replyWaiters = {}
  const reply = (word) =>
    replies[word] ? Promise.resolve(replies[word]) : new Promise((resolve) => (replyWaiters[word] = resolve))
  control.onmessage = ({ data }) => {
    const [word, first, second, third] = String(data).split(' ')
    if (word === 'ping') {
      const index = Number(first)
      pingTrip.set(index, performance.now() - pingSent.get(index))
      if (pingWaiter?.index === index) pingWaiter.resolve()
    } else if (word === 'received' || word === 'sent') {
      replies[word] = { bytes: Number(first), sha256: second, ms: Number(third) }
      replyWaiters[word]?.(replies[word])
    }
  }
  const ping = (index) => {
    pingSent.set(index, performance.now())
    control.send(`ping ${index} `.padEnd(200, 'x'))
  }

  status('signaling')
  const socket = new WebSocket(params.get('ws') ?? 'ws://127.0.0.1:8765')
  await within(new Promise((resolve, reject) => ((socket.onopen = resolve), (socket.onerror = reject))), 5000, 'socket')
  const answer = new Promise((resolve) => {
    socket.onmessage = ({ data }) => String(data).startsWith('answer\n') && resolve(String(data).slice(7))
  })
  await pc.setLocalDescription()
  await within(
    new Promise((resolve) => {
      if (pc.iceGatheringState === 'complete') resolve()
      pc.addEventListener('icegatheringstatechange', () => pc.iceGatheringState === 'complete' && resolve())
    }),
    15000,
    'gathering',
  )
  socket.send(`offer\n${pc.localDescription.sdp}`)
  await pc.setRemoteDescription({ type: 'answer', sdp: await within(answer, 15000, 'answer') })
  status('connecting')
  await within(opened, 20000, 'channels')
  const openMs = performance.now() - started

  status('idle pings')
  for (let index = 0; index < idlePings; index += 1) {
    const answered = new Promise((resolve) => (pingWaiter = { index, resolve }))
    ping(index)
    await within(answered, 5000, `ping ${index}`)
  }
  const idleRoundTrip = roundTrips([...pingTrip.values()], idlePings)

  status('upload')
  const upload = pattern(bulkBytes)
  const uploadSha256 = await sha256(upload)
  control.send(`expect ${bulkBytes}`)
  bulk.bufferedAmountLowThreshold = highWater / 4
  const uploadStarted = performance.now()
  for (let offset = 0; offset < bulkBytes; offset += chunkBytes) {
    if (bulk.bufferedAmount > highWater)
      await new Promise((resolve) => bulk.addEventListener('bufferedamountlow', resolve, { once: true }))
    bulk.send(upload.subarray(offset, Math.min(offset + chunkBytes, bulkBytes)))
  }
  const received = await within(reply('received'), 120000, 'upload')
  const uploadMs = performance.now() - uploadStarted

  status('download')
  const download = new Uint8Array(bulkBytes)
  let downloaded = 0
  const downloadDone = new Promise((resolve) => {
    bulk.onmessage = ({ data }) => {
      download.set(new Uint8Array(data), downloaded)
      downloaded += data.byteLength
      if (downloaded >= bulkBytes) resolve()
    }
  })
  let busyIndex = idlePings
  const downloadStarted = performance.now()
  control.send(`send ${bulkBytes}`)
  const pinger = setInterval(() => ping(busyIndex++), 10)
  const [sent] = await within(Promise.all([reply('sent'), downloadDone]), 120000, 'download')
  const downloadMs = performance.now() - downloadStarted
  clearInterval(pinger)
  await new Promise((resolve) => setTimeout(resolve, 500))
  const busy = [...pingTrip].filter(([index]) => index >= idlePings).map(([, ms]) => ms)

  const stats = await pc.getStats()
  let selected = null
  stats.forEach((report) => {
    if (report.type !== 'transport' || !report.selectedCandidatePairId) return
    const pair = stats.get(report.selectedCandidatePairId)
    const local = stats.get(pair.localCandidateId)
    const remote = stats.get(pair.remoteCandidateId)
    selected = {
      local: `${local.candidateType}/${local.protocol}${local.relayProtocol ? `/turn-${local.relayProtocol}` : ''}`,
      remote: `${remote.candidateType}/${remote.protocol}`,
    }
  })
  const mibPerSecond = (ms) => +(bulkBytes / mebibyte / (ms / 1000)).toFixed(3)
  const result = {
    userAgent: navigator.userAgent,
    relay,
    selected,
    maxMessageSize: pc.sctp?.maxMessageSize ?? null,
    openMs: +openMs.toFixed(3),
    idleRoundTrip,
    upload: { bytes: bulkBytes, mibPerSecond: mibPerSecond(uploadMs), sha256Match: received.sha256 === uploadSha256 },
    download: {
      bytes: bulkBytes,
      mibPerSecond: mibPerSecond(downloadMs),
      sha256Match: sent.sha256 === (await sha256(download)),
    },
    roundTripDuringDownload: roundTrips(busy, busyIndex - idlePings),
  }
  control.send(`report ${JSON.stringify(result)}`)
  return result
}

run().then(
  (result) => {
    document.getElementById('result').textContent = JSON.stringify(result, null, 2)
    status(result.upload.sha256Match && result.download.sha256Match ? 'passed' : 'failed')
  },
  (error) => status(`failed: ${error.message}`),
)
</script>
