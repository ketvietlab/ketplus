name: public-tree-hygiene

# The build workflow skips documentation-only promotions; this small check does not.
on:
  pull_request:
    branches: [integration, develop, main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-tree:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: python3 tests/hygiene/test_public_tree.py
