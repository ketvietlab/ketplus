name: promotion

# Feature and fix pull requests target integration, which has no CI. A pull
# request into develop promotes the integration tip as a batch and must come
# from integration itself; the build workflow verifies the same head.
#
# pull_request_target runs this file and the policy script from develop, so a
# pull request cannot rewrite the check that guards it. The head is fetched only
# as git data and never executed; no secret is used and the token is read-only.
on:
  pull_request_target:
    branches: [develop]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  provenance:
    name: promotion provenance
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
      - name: Check the promotion policy
        run: bash .github/scripts/check-develop-promotion.test.sh
      - name: Fetch the promotion head as data
        env:
          PULL_NUMBER: ${{ github.event.pull_request.number }}
        run: >-
          git fetch --no-tags --quiet origin
          "+refs/pull/${PULL_NUMBER}/head:refs/remotes/promotion/head"
      - name: Require the integration tip
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_BRANCH: ${{ github.head_ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPOSITORY: ${{ github.repository }}
        run: bash .github/scripts/check-develop-promotion.sh
