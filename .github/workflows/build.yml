name: build

permissions:
  contents: read

# Integration authors test changes locally; Linux packaging has its own ARM-only
# build-only PR caller. The separate
# lightweight public-tree workflow checks publication boundaries on every PR.
# The build runs on promotion pull requests into develop, on release pull
# requests into main and on the production main commit. The promotion pull
# request already built the head that lands on develop.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
  pull_request:
    branches: [develop, main]
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:

# A newer commit on the same branch or PR makes the running build obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  linux-pro-packages:
    strategy:
      fail-fast: false
      matrix:
        architecture: [amd64, arm64]
    uses: ./.github/workflows/linux-pro-packages.yml
    with:
      architecture: ${{ matrix.architecture }}

  linux-daemon:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4
        with:
          version: "6.11.1"
          modules: qtwebsockets
          cache: true
      - name: Guard public repository boundaries
        run: python3 tests/hygiene/test_public_tree.py
      - name: Install headless build dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build libssl-dev libgl1-mesa-dev patchelf
      - name: Configure independent daemon
        run: cmake -S . -B build/daemon -G Ninja -DCMAKE_BUILD_TYPE=Release -DKETPLUS_PRODUCTION_RELEASE=ON -DKETPLUS_EDITION=pro -DKETPLUS_BUILD_DESKTOP=OFF -DKETPLUS_BUILD_TESTS=ON
      - name: Build and test without a display or provider quota
        run: |
          cmake --build build/daemon --parallel 4
          ctest --test-dir build/daemon --output-on-failure --parallel 2
      - name: Stage complete runtime and inspect build information
        run: |
          cmake --install build/daemon --prefix "$RUNNER_TEMP/ketplus-daemon"
          env -u LD_LIBRARY_PATH "$RUNNER_TEMP/ketplus-daemon/bin/ketplus_daemon" --check-runtime
          "$RUNNER_TEMP/ketplus-daemon/bin/ketplus_daemon" --build-info
          cpack --config build/daemon/CPackConfig.cmake -B build/packages
      - name: Verify installed daemon and CLI in a clean Ubuntu runtime
        run: |
          docker build -f packaging/linux/Dockerfile.runtime-test -t ketplus-daemon-runtime-test packaging/linux
          docker run --rm -v "$RUNNER_TEMP/ketplus-daemon:/runtime:ro" ketplus-daemon-runtime-test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-daemon-x86_64
          path: build/packages/*.tar.gz

  browser:
    runs-on: ubuntu-latest
    # `playwright install --with-deps` once hung in apt for the 6-hour default.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/browser/package-lock.json
      - name: Install browser test dependencies
        working-directory: apps/browser
        timeout-minutes: 8
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Browser protocol and socket regression tests
        working-directory: apps/browser
        env:
          KETPLUS_BROWSER_ENGINE: playwright
        run: npm test
      - name: Stage and smoke the bundled browser runtime
        working-directory: apps/browser
        env:
          KETPLUS_BROWSER_ENGINE: playwright
        run: |
          out="$RUNNER_TEMP/ketplus-browser-runtime"
          node scripts/package-runtime.mjs --out "$out"
          node scripts/smoke-runtime.mjs "$out"
      - name: Claude browser integration without provider calls
        run: node --test apps/daemon/providers/claude-sidecar/test/browser.test.mjs apps/daemon/providers/claude-sidecar/test/transcript.test.mjs apps/daemon/providers/claude-sidecar/test/input.test.mjs

  # Each edition's suite builds once per OS on the oldest runner version, then
  # runs on every listed version of that OS (os-suite.yml). Full Linux Desktop
  # and Windows Pro builds remain deferred; the daemon has its own Linux lane.
  lite-linux:
    uses: ./.github/workflows/os-suite.yml
    with:
      suite: lite
      build-runner: ubuntu-22.04
      test-runners: '["ubuntu-22.04", "ubuntu-24.04"]'
      qt-version: "6.10.*"
      qt-modules: qt5compat
      configure-args: -DCMAKE_BUILD_TYPE=Release -DKETPLUS_EDITION=lite
      ctest-args: --verbose

  lite-macos:
    uses: ./.github/workflows/os-suite.yml
    with:
      suite: lite
      build-runner: macos-15
      test-runners: '["macos-15", "macos-26"]'
      qt-version: "6.10.*"
      qt-modules: qt5compat
      configure-args: -DCMAKE_BUILD_TYPE=Release -DKETPLUS_EDITION=lite
      ctest-args: --verbose

  lite-windows:
    uses: ./.github/workflows/os-suite.yml
    with:
      suite: lite
      build-runner: windows-2022
      test-runners: '["windows-2022", "windows-2025"]'
      qt-version: "6.10.*"
      qt-modules: qt5compat
      configure-args: -DCMAKE_BUILD_TYPE=Release -DKETPLUS_EDITION=lite
      ctest-args: --verbose

  pro-macos:
    uses: ./.github/workflows/os-suite.yml
    with:
      suite: pro
      build-runner: macos-15
      test-runners: '["macos-15", "macos-26"]'
      qt-version: "6.11.1"
      qt-modules: qt5compat qtwebsockets qtwebview
      configure-args: -DCMAKE_BUILD_TYPE=Release -DKETPLUS_PRODUCTION_RELEASE=ON -DKETPLUS_EDITION=pro
      node: true
      build-timeout: 60
      # One test at a time: the desktop/daemon integration tests time out when
      # they share the runner's three cores. The suite takes about 30 minutes.
      test-timeout: 60
