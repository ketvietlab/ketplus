name: build

on:
  push:
  pull_request:

jobs:
  build:
    env:
      SCCACHE_GHA_ENABLED: "true"
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Restore Qt SDK
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.10.*"
          modules: qt5compat
          cache: true

      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'

      - uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Restore source dependencies
        uses: actions/cache@v5
        with:
          path: .cache/fetchcontent
          key: fetchcontent-${{ runner.os }}-qt-6.10-${{ hashFiles('cmake/Dependencies.cmake') }}

      - name: Restore compiler objects
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure --verbose

      - name: Diagnose Windows test failures
        if: failure() && runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem build/ketplus_*_tests.txt | ForEach-Object {
            Write-Host "== $($_.Name) =="
            Get-Content $_
          }
